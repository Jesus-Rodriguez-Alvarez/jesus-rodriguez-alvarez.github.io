<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jesús Rodríguez Álvarez — Administración de Sistemas Informáticos en Red">
    <title>Jesús Rodríguez Álvarez</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --gold:        #c9a84c;
            --gold-light:  #e8d08a;
            --gold-dim:    rgba(201,168,76,0.18);
            --gold-border: rgba(201,168,76,0.30);
            --bg:          #08080f;
            --surface:     rgba(255,255,255,0.045);
            --surface-h:   rgba(255,255,255,0.08);
            --text:        #f0f0f5;
            --muted:       rgba(240,240,245,0.55);
        }

        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
            overflow-x: hidden;
            color: var(--text);
        }

        /* ─── Fondo animado ─── */
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0;
            background:
                radial-gradient(ellipse 60% 50% at 15% 15%, rgba(201,168,76,0.07) 0%, transparent 70%),
                radial-gradient(ellipse 60% 50% at 85% 85%, rgba(80,100,220,0.07) 0%, transparent 70%);
            pointer-events: none;
        }

        /* ─── Partículas ─── */
        canvas#particles {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none;
        }

        /* ─── Layout ─── */
        .card {
            position: relative; z-index: 1;
            width: 100%;
            max-width: 460px;
            background: rgba(12,12,24,0.80);
            border: 1px solid rgba(201,168,76,0.18);
            border-radius: 28px;
            padding: 48px 36px 40px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow:
                0 0 0 1px rgba(201,168,76,0.08),
                0 20px 60px rgba(0,0,0,0.6),
                0 0 80px rgba(201,168,76,0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 36px;
        }

        /* ─── Avatar ─── */
        .avatar-wrap {
            position: relative;
            width: 100px; height: 100px;
        }

        .avatar-ring {
            position: absolute; inset: -4px;
            border-radius: 50%;
            background: conic-gradient(var(--gold), var(--gold-light), transparent, var(--gold));
            animation: spin 4s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .avatar {
            position: relative; z-index: 1;
            width: 100px; height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1620 0%, #0d0d1a 100%);
            border: 3px solid var(--bg);
            display: flex; align-items: center; justify-content: center;
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -1px;
            color: var(--gold);
            user-select: none;
        }

        /* ─── Encabezado ─── */
        .profile { text-align: center; }

        .profile h1 {
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.2;
            color: var(--text);
        }

        .profile h1 em {
            font-style: normal;
            background: linear-gradient(90deg, var(--gold) 0%, var(--gold-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .profile .role {
            margin-top: 8px;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* ─── Separador ─── */
        .sep {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-border), transparent);
        }

        /* ─── Links ─── */
        .links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid transparent;
            background: var(--surface);
            text-decoration: none;
            color: var(--text);
            cursor: pointer;
            transition: background 0.25s, border-color 0.25s, transform 0.2s, box-shadow 0.25s;
            position: relative;
            overflow: hidden;
        }

        /* Shimmer sweep */
        .btn::before {
            content: '';
            position: absolute; top: 0; left: -120%;
            width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            transform: skewX(-15deg);
            transition: left 0.6s ease;
        }

        .btn:hover::before { left: 150%; }

        .btn:hover {
            background: var(--surface-h);
            transform: translateY(-3px);
        }

        .btn:active { transform: translateY(-1px); }

        /* Icon bubble */
        .icon {
            width: 44px; height: 44px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: transform 0.25s;
        }

        .btn:hover .icon { transform: scale(1.1); }

        .icon svg { width: 22px; height: 22px; }

        /* Text group */
        .btn-text { flex: 1; min-width: 0; }
        .btn-label {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .btn-sub {
            font-size: 0.72rem;
            color: var(--muted);
            margin-top: 2px;
        }

        /* Arrow */
        .arrow {
            width: 18px; height: 18px;
            color: var(--muted);
            flex-shrink: 0;
            transition: transform 0.25s, color 0.25s;
        }

        .btn:hover .arrow { transform: translateX(4px); color: var(--gold); }

        /* ─── Per-service colours ─── */
        /* CV / PDF — gold */
        .btn-cv {
            border-color: var(--gold-border);
        }
        .btn-cv .icon {
            background: var(--gold-dim);
            border: 1px solid var(--gold-border);
        }
        .btn-cv .icon svg { fill: var(--gold); }
        .btn-cv:hover {
            border-color: var(--gold);
            box-shadow: 0 8px 28px rgba(201,168,76,0.18);
        }

        /* LinkedIn — blue */
        .btn-li {
            border-color: rgba(0,119,181,0.25);
        }
        .btn-li .icon {
            background: rgba(0,119,181,0.15);
            border: 1px solid rgba(0,119,181,0.3);
        }
        .btn-li .icon svg { fill: #0a85c2; }
        .btn-li:hover {
            border-color: #0a85c2;
            box-shadow: 0 8px 28px rgba(0,133,194,0.18);
        }

        /* Credly — orange */
        .btn-cr {
            border-color: rgba(255,110,0,0.25);
        }
        .btn-cr .icon {
            background: rgba(255,110,0,0.12);
            border: 1px solid rgba(255,110,0,0.3);
        }
        .btn-cr .icon svg { fill: #ff6e00; }
        .btn-cr:hover {
            border-color: #ff6e00;
            box-shadow: 0 8px 28px rgba(255,110,0,0.18);
        }

        /* GitHub — white */
        .btn-gh {
            border-color: rgba(255,255,255,0.1);
        }
        .btn-gh .icon {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .btn-gh .icon svg { fill: #e6e6e6; }
        .btn-gh:hover {
            border-color: rgba(255,255,255,0.4);
            box-shadow: 0 8px 28px rgba(255,255,255,0.08);
        }

        /* ─── Footer ─── */
        footer {
            font-size: 0.7rem;
            color: rgba(240,240,245,0.25);
            letter-spacing: 0.5px;
            text-align: center;
        }

        /* ─── Responsive ─── */
        @media (max-width: 480px) {
            .card { padding: 36px 22px 32px; border-radius: 20px; }
            .profile h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <nav class="links" aria-label="Links de contacto">

        <a href="./CV_Jesús-Rodríguez-Álvarez.pdf" download class="btn btn-cv" aria-label="Descargar CV en PDF">

        <!-- LinkedIn -->
        <a href="https://www.linkedin.com/in/jes%C3%BAs-rodr%C3%ADguez-%C3%A1lvarez/" target="_blank" rel="noopener noreferrer" class="btn btn-li" aria-label="Ir a LinkedIn">

<script>
/* ─── Particle canvas ─── */
(function () {
    const canvas = document.getElementById('particles');
    const ctx    = canvas.getContext('2d');
    let   W, H, particles;

    function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }

    function mkParticle() {
        return {
            x:    Math.random() * W,
            y:    H + Math.random() * 60,
            r:    Math.random() * 1.6 + 0.4,
            vx:   (Math.random() - 0.5) * 0.4,
            vy:   -(Math.random() * 0.6 + 0.2),
            life: 0,
            maxL: Math.random() * 300 + 200,
        };
    }

    function init() {
        resize();
        particles = Array.from({ length: 35 }, mkParticle);
        particles.forEach(p => { p.y = Math.random() * H; p.life = Math.random() * p.maxL; });
    }

    function step() {
        ctx.clearRect(0, 0, W, H);
        for (const p of particles) {
            p.x += p.vx; p.y += p.vy; p.life++;
            const alpha = Math.sin((p.life / p.maxL) * Math.PI) * 0.55;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(201,168,76,${alpha})`;
            ctx.fill();
            if (p.life >= p.maxL) Object.assign(p, mkParticle());
        }
        requestAnimationFrame(step);
    }

    window.addEventListener('resize', resize);
    init();
    step();
})();
</script>
</body>
